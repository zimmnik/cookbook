global
    maxconn 128000
    log stdout format raw local0
    user haproxy
    group haproxy
    stats socket /var/run/haproxy.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    external-check
    insecure-fork-wanted

defaults
    log global
    log-format "gmt_datetime:%T, client_address:%ci, client_port:%cp, server_address:%si, server_port:%sp, path:%HU, status:%ST"
    #log-format-sd %{+Q,+E}o\ [exampleSDID@1234\ header=%[capture.req.hdr(0)]]
    option dontlognull

    mode http
    maxconn 128000

    timeout connect 5s
    timeout client 10s
    timeout server 20s

    timeout client-fin 1s
    timeout server-fin 1s

    timeout http-request 10s
    timeout http-keep-alive 50s

cache artifacts-cache
    total-max-size 4095
    max-object-size 200000000  # 200 Mb
    max-age 300

frontend http-in
    bind 0.0.0.0:80
    redirect scheme https code 301 if !{ ssl_fc }

frontend https-in
    bind 0.0.0.0:443 ssl crt /conf/cert.pem alpn h2,http/1.1
    mode http
    http-request set-header X-Forwarded-Proto https
    option httpclose
    option forwardfor

    log-format "${HAPROXY_HTTP_LOG_FMT} hdrs:%{+Q}[var(txn.res_hdrs)]"
    http-response set-var(txn.res_hdrs) res.hdrs

    use_backend pulp-common-mirror-ansible-galaxy if { hdr(host) -i artifactory.site } { path_beg /pulp /repository/common-proxy-ansible-galaxy/ }

backend pulp-common-mirror-ansible-galaxy
    option httpchk HEAD /pulp/api/v3/status/
    http-request replace-path /repository/common-proxy-ansible-galaxy/(.*) /pulp_ansible/galaxy/full/\1 if { url_beg /repository/ }
    #http-response replace-header location ^http:(.*)$ https:\1
    timeout server 60s
    server main 1.2.3.4:80

